[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-rustlingtree"
version = "0.1.0"
description = "Reduced-order approach simulation package backed by OpenAP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adjustText>=1.4.0",
    "fastapi>=0.116.0",
    "fdasrsf>=2.6.9",
    "hdbscan>=0.8.44",
    "ipykernel>=7.2.0",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "matplotlib>=3.8.0",
    "langgraph>=0.2.0",
    "notebook>=7.5.5",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "openap>=2.5.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.0.0",
    "pyproj>=3.6.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "rich>=14.3.4",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.35.0",
    "black>=26.5.1",
]

[project.scripts]
adsb-trajectory-compress = "scenario.trajectory_compressor.cli:main"
hllrd = "hllrd.cli:main"
hllrd-build-matrix = "hllrd.cli:build_matrix_main"
hllrd-candidates = "hllrd.cli:candidates_main"
hllrd-elastic-fpca = "hllrd.cli:elastic_fpca_main"
hllrd-fit = "hllrd.cli:fit_main"
hllrd-report = "hllrd.cli:report_main"
hllrd-transform = "hllrd.cli:transform_main"
hailmary-build-clusters = "hailmary.cli.build_clusters:main"
hailmary-build-templates = "hailmary.cli.build_templates:main"
hailmary-build-route-graph = "hailmary.cli.build_route_graph:main"
hailmary-build-traffic-batch = "hailmary.cli.build_traffic_batch:main"
hailmary-build-offline-corpus = "hailmary.cli.build_offline_corpus:main"
hailmary-visualize-clusters = "hailmary.clustering.visualization:main"
hailmary-visualize-demand-scaling = "hailmary.cli.visualize_demand_scaling:main"
hailmary-visualize-event-queue = "hailmary.cli.visualize_event_queue:main"
hailmary-simulate = "hailmary.cli.simulate:main"
scenario-manager-api = "mcp_tools.scenario_manager.server:main"
scenario-manager-precompute-artifact = "mcp_tools.scenario_manager.precompute_artifact:main"
vlm-ppe = "vlm_ppe.cli:main"
ppe-eval = "ppe_evaluation.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
